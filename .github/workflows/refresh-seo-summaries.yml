name: Refresh SEO summaries

# Rebuilds `property_seo_summaries`, the table behind the public
# /p/{borough}/{slug} landing pages.
#
# Runs here rather than as a Vercel cron because a full citywide sweep reads
# several million rows across four Socrata datasets and takes far longer than
# a serverless function is allowed to live.

on:
  schedule:
    # 07:20 UTC — after the city's overnight dataset publishes, and off the
    # hour so it isn't queued behind everyone else's :00 cron.
    - cron: "20 7 * * *"
  workflow_dispatch:
    inputs:
      borough:
        description: "Limit to one borough (1-5). Leave blank for all."
        required: false
        type: string
      dry_run:
        description: "Compute and report without writing"
        required: false
        type: boolean
        default: false

concurrency:
  # Two overlapping sweeps would fight over the same rows and double the
  # Socrata load for no benefit.
  group: refresh-seo-summaries
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # A full sweep is long; the default 6h cap would mask a hang.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Without this, a missing credential surfaces as a stack trace from deep
      # inside the refresh script, which says nothing about *where* the value
      # was supposed to come from. GitHub renders an unset secret as an empty
      # string rather than failing, so the mistake is invisible at the call
      # site. Reports presence only — never a value.
      - name: Preflight — are credentials visible to this workflow?
        env:
          S_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          S_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          S_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
          # Same names read from the *Variables* tab of the same settings page.
          # Values added there are `vars.*` and are invisible to `secrets.*`,
          # which is a silent and very easy mistake to make.
          V_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          V_KEY: ${{ vars.SUPABASE_SERVICE_ROLE_KEY }}
          V_TOKEN: ${{ vars.SOCRATA_APP_TOKEN }}
        run: |
          state() { if [ -n "$1" ]; then printf 'set'; else printf 'EMPTY'; fi; }

          printf '%-28s %-10s %-10s\n' 'NAME' 'secrets.*' 'vars.*'
          printf '%-28s %-10s %-10s\n' 'NEXT_PUBLIC_SUPABASE_URL'  "$(state "$S_URL")"   "$(state "$V_URL")"
          printf '%-28s %-10s %-10s\n' 'SUPABASE_SERVICE_ROLE_KEY' "$(state "$S_KEY")"   "$(state "$V_KEY")"
          printf '%-28s %-10s %-10s\n' 'SOCRATA_APP_TOKEN'         "$(state "$S_TOKEN")" "$(state "$V_TOKEN")"
          echo

          if [ -n "$V_URL$V_KEY$V_TOKEN" ] && [ -z "$S_URL$S_KEY" ]; then
            echo "Found values under Variables but not Secrets."
            echo "Re-add them on the Secrets tab: Settings -> Secrets and variables -> Actions -> Repository secrets."
            exit 1
          fi

          if [ -z "$S_URL" ] || [ -z "$S_KEY" ]; then
            echo "Missing required credentials."
            echo "Add them at Settings -> Secrets and variables -> Actions, under *Repository secrets*"
            echo "(not Variables, and not Environment secrets — this job declares no environment):"
            if [ -z "$S_URL" ]; then
              echo "  - NEXT_PUBLIC_SUPABASE_URL   e.g. https://<project-ref>.supabase.co"
            fi
            if [ -z "$S_KEY" ]; then
              echo "  - SUPABASE_SERVICE_ROLE_KEY  the service_role key from Project Settings -> API"
            fi
            exit 1
          fi

          # Catches the most likely wrong value: the site's own domain. This is
          # the Supabase API endpoint, not where the website is served.
          case "$S_URL" in
            https://*.supabase.co|https://*.supabase.co/) ;;
            *)
              echo "NEXT_PUBLIC_SUPABASE_URL does not look like a Supabase API endpoint."
              echo "Expected https://<project-ref>.supabase.co — this is the database URL,"
              echo "not your website's domain. (Value withheld.)"
              exit 1
              ;;
          esac

          if [ -z "$S_TOKEN" ]; then
            echo "Note: SOCRATA_APP_TOKEN is unset. The sweep will run, but anonymous"
            echo "SODA requests are throttled hard and a full pass may be slow or fail."
          fi

          echo "Credentials look usable."

      - name: Refresh summaries
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Optional, but anonymous Socrata traffic is throttled hard.
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: |
          npm run seo:refresh -- \
            ${{ inputs.borough && format('--borough {0}', inputs.borough) || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}
